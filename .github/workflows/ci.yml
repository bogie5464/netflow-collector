name: ci

on:
  push:
  pull_request:
  schedule:
    # nightly load verification: the load tag runs without -race and asserts
    # the throughput floor and the ingested + dropped == offered invariant.
    - cron: "0 3 * * *"

permissions:
  contents: read

jobs:
  gate:
    name: build, vet, lint, test, vuln scan
    runs-on: ubuntu-latest
    permissions:
      contents: write # only used by the coverage-badge commit step, on pushes to main
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Local services for the integration gates
        run: docker compose up -d --wait redpanda

      - name: Environment
        run: cp .env.example .env

      - name: Build
        run: go build -o bin/collector ./cmd/collector

      - name: Tidy check
        run: go mod tidy -diff

      - name: Vet
        run: go vet ./...

      - name: Lint
        run: go tool golangci-lint run ./...

      - name: Test
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Coverage percentage
        id: coverage
        run: |
          pct=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub("%","",$3); print $3}')
          color=$(awk -v p="$pct" 'BEGIN {
            if (p >= 80) print "brightgreen";
            else if (p >= 60) print "yellow";
            else print "red"
          }')
          echo "percentage=$pct" >> "$GITHUB_OUTPUT"
          echo "color=$color" >> "$GITHUB_OUTPUT"

      - name: Generate coverage badge
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: emibcn/badge-action@v2.0.2
        with:
          label: coverage
          status: "${{ steps.coverage.outputs.percentage }}%"
          color: ${{ steps.coverage.outputs.color }}
          path: .github/badges/coverage.svg

      - name: Commit coverage badge
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/badges/coverage.svg
          git diff --cached --quiet || git commit -m "chore: update coverage badge [skip ci]"
          git push

      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: OpenAPI drift
        run: ./bin/collector -dump-openapi > /tmp/openapi.json && diff -u docs/openapi.json /tmp/openapi.json

      - name: Services down
        if: always()
        run: docker compose down

  image:
    name: container image
    runs-on: ubuntu-latest
    needs: gate
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker compose --profile app build
      - name: Image size under 20 MB
        run: test "$(docker image inspect netflow-collector:latest --format '{{.Size}}')" -lt 20971520

  nightly-load:
    name: nightly load verification
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Load test (no -race, by design)
        run: go test -tags=load -count=1 -v -run TestPipelineLoad ./internal/pipeline/...
      - name: Whole-tree race gate
        run: |
          docker compose up -d --wait redpanda
          cp .env.example .env
          go test -race -count=1 ./...
          docker compose down
