name: release

# Publishes the container image to GHCR for every version tag, so the
# Kubernetes manifests in deploy/k8s have something to pull. Multi-arch
# because ARM nodes are common on both clouds and edge hardware.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)publish, e.g. v1.2.0"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: publish ghcr.io image
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image size gate (same budget as ci.yml)
        run: |
          docker buildx build --load -t sizecheck --build-arg VERSION=${{ steps.tag.outputs.tag }} .
          docker create --name sizecheck sizecheck
          docker cp sizecheck:/usr/local/bin/collector /tmp/collector
          docker rm sizecheck
          size=$(stat -c %s /tmp/collector)
          echo "collector binary: $size bytes"
          test "$size" -lt 41943040

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.tag.outputs.tag }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.tag }}
            ghcr.io/${{ github.repository }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.tag.outputs.version }}
            org.opencontainers.image.licenses=MIT
