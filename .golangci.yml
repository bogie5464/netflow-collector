# golangci-lint v2 schema. A v1 file will not load: v2 starts with `version: "2"` and formatters
# live in a top-level `formatters` block rather than under `linters`
# (knowledge/runtime-tracks/go.md, Gotchas).
#
# Run with: go tool golangci-lint run ./...
# Verify this file parses with: go tool golangci-lint config verify
version: "2"

linters:
  enable:
    - bodyclose
    - errorlint
    - misspell
    - revive
  settings:
    revive:
      rules:
        # The domain package is `flow`, and its exported types (FlowRecord, FlowType, FlowQuery,
        # FlowResultPage — blueprint.md §4/§9 step 1) are named consistently that way throughout
        # this whole blueprint. revive's default "exported" rule flags that as stuttering
        # (flow.FlowRecord). Disabling only the stutter check, not the doc-comment requirement,
        # keeps the blueprint's own mandated vocabulary and a real lint gate both true at once —
        # verified empirically: 0 issues with this setting, 5 stutter findings without it.
        - name: exported
          arguments:
            - "disableStutteringCheck"
  exclusions:
    paths:
      # The design bundle lives inside the project at blueprints/<slug>/ and its workspace/
      # mirrors the repo root. It carries no Go source, but this exclusion keeps every
      # tree-walking pass out of it regardless. See blueprint.md §19.6.
      - blueprints

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    paths:
      - blueprints
